# Provisional chess mate-in-one parameters.
# Nothing here is hardware-calibrated or taken from measured CAD.
# The mating move is not stored in this file. The scorer derives it.

light_intensity: 2000.0

# Reference set: Regal Games 10.5 x 10.5 in reversible wooden board (ASIN B08C1QBGQJ),
# matched to the user's product photo. Only the board's outer size is from the listing.
# Every other size below is ESTIMATED from photo proportions and labelled as such.
# Task 7: White mates in one, white pieces nearest the robot (rank 1 toward -X).
# This is the color mirror of the earlier Black-to-move FEN; the solver finds
# exactly one mate, a quiet queen move. build_puzzles rejects Black to move,
# captures, castling, promotion, and en passant.
fen_sequence:
  - "rnbqkbnr/ppppp3/5p1p/6p1/4PN1P/3NB1P1/PPPP1P2/R1BQRK2 w kq - 0 2"

# Piece meshes: Poly Haven "Chess Set" (CC0), committed under my_package/assets/chess_set
# by tools/build_chess_assets.py. The source pieces are larger, wider Staunton pieces, so
# they are scaled narrower than tall to the slimmer Regal proportions (ESTIMATED from the
# photo: king about two squares tall, bases about 0.7 of a square across).
# PieceProfile height/base radius below must equal the scaled mesh; the loader checks it.
piece_mesh:
  scale_xy: 0.52
  scale_z: 0.64
  # Cream lacquered wood and glossy black, linear RGB. Estimated from the photo.
  # Tuned after the first server render (159ae2b): the earlier clearcoat made black pieces
  # mirror the wood table, and the cream read as white.
  white_rgb: [0.72, 0.55, 0.32]
  white_roughness: 0.5
  black_rgb: [0.006, 0.006, 0.006]
  black_roughness: 0.3

board:
  # Outer size 0.2667 m (10.5 in) is from the listing: 8 * square + 2 * border.
  # The 30 mm square and the 13.35 mm border split are ESTIMATED from the photo, where the
  # border is a little under half a square. The listing's 0.04 in thickness is not
  # plausible for a wooden board; 8 mm is ESTIMATED from the photo.
  square_m: 0.030
  border_m: 0.01335
  thickness_m: 0.008
  # Thin dark inlay line around the playing field and rounded outer corners. ESTIMATED.
  inlay_gap_m: 0.0025
  inlay_width_m: 0.0008
  corner_radius_m: 0.008
  mass_kg: 0.55
  static_friction: 0.55
  dynamic_friction: 0.40
  restitution: 0.02
  contact_offset_m: 0.0003
  solver_position_iterations: 16
  solver_velocity_iterations: 1

pieces:
  # height_m and base_radius_m are the scaled mesh (checked against assets/chess_set/manifest.json).
  # Masses are unchanged estimates.
  - role: king
    height_m: 0.0608
    base_radius_m: 0.0109
    mass_kg: 0.020
  - role: queen
    height_m: 0.0581
    base_radius_m: 0.0096
    mass_kg: 0.018
  - role: bishop
    height_m: 0.0549
    base_radius_m: 0.0084
    mass_kg: 0.014
  - role: knight
    height_m: 0.048
    base_radius_m: 0.0102
    mass_kg: 0.015
  - role: rook
    height_m: 0.0388
    base_radius_m: 0.0096
    mass_kg: 0.016
  - role: pawn
    height_m: 0.0344
    base_radius_m: 0.0074
    mass_kg: 0.008

scoring:
  lift_clearance_m: 0.015
  board_motion_tolerance_m: 0.005
  board_yaw_tolerance_deg: 5.0
  upright_angle_deg: 12.0
  rest_z_tolerance_m: 0.004
  center_tolerance_m: 0.001
  grasp_radius_m: 0.055
  hold_open_fraction_max: 0.35
  episode_length_s: 90.0

table:
  # Measured on the server (environments/tools/probe_runtime.py --sim): maple_table_robolab
  # spawns at the origin; its collision top is z = 0.003 and its footprint is
  # x [0.1986, 0.8986], y [-0.4779, 0.5221].
  top_z_m: 0.003
  center_xy: [0.5486, 0.0221]
  half_extents_xy: [0.35, 0.50]
  fall_below_m: 0.05

# Identity quaternion is xyzw. Rank 1 is toward -X, which is the robot side.
board_pose:
  position_xyz: [0.55, 0.0, 0.007]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

# Policy sensor views: upright ROS optical axes, square pixels, board-focused lenses.
# Poses use world coordinates and the measured tabletop. Framing awaits the
# next server capture; no images are rotated or cropped in the Inspect adapter.
cameras:
  - name: overhead_cam
    eye_xyz: [1.2, 0.0, 0.903]
    target_xyz: [0.55, 0.0, 0.023]
    # Elevated view from the far side: home grippers project toward the near edge.
    # Keep White at the bottom even though the camera is no longer nearly vertical.
    up_xyz: [1.0, 0.0, 0.0]
    rotation_xyzw: [-0.6716334681908381, 0.671633468190838, 0.22115262694787632, -0.22115262694787632]
    width: 256
    height: 256
    focal_length: 13.0
    focus_distance: 40.0
    horizontal_aperture: 5.376
    vertical_aperture: 5.376
  - name: front_cam
    eye_xyz: [1.0, 0.0, 0.383]
    target_xyz: [0.55, 0.0, 0.043]
    rotation_xyzw: [0.6330152227999126, 0.6330152227999126, -0.3151058991887917, -0.3151058991887917]
    width: 256
    height: 256
    focal_length: 7.0
    focus_distance: 40.0
    horizontal_aperture: 5.376
    vertical_aperture: 5.376
  - name: side_cam
    eye_xyz: [0.55, -0.56, 0.363]
    target_xyz: [0.55, 0.0, 0.043]
    rotation_xyzw: [-0.8649100931185951, 0.0, -0.0, 0.5019268181932335]
    width: 256
    height: 256
    focal_length: 7.5
    focus_distance: 40.0
    horizontal_aperture: 5.376
    vertical_aperture: 5.376

robot:
  usda_path: /home/ubuntu/workspace/robocurve/assets/yam/yam_source_resolved/yam_source_resolved.usda
  arm_layout: duplicated_single_arm
  home_arm_rad: [0.4, 1.2, 1.0, -0.5, 0.0, 0.0]
  finger_closed_m: 0.0
  finger_open_m: -0.04695
  home_open_fraction: 1.0
  arm_action_scale: 1.0
  gripper_action_scale: 1.0
  proximal_stiffness: 80.0
  proximal_damping: 8.0
  distal_stiffness: 20.0
  distal_damping: 2.0
  finger_stiffness: 40.0
  finger_damping: 2.0
  arm_effort_limit: 20.0
  arm_velocity_limit: 3.0
  finger_effort_limit: 10.0
  finger_velocity_limit: 0.2
  # Bases sit on the tabletop, 7 cm inside its near edge (x 0.1986). The YAM base
  # footprint is not yet measured; tools/render_check.py reports it against the table.
  left_pose:
    position_xyz: [0.27, 0.22, 0.003]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
  right_pose:
    position_xyz: [0.27, -0.22, 0.003]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
