# An M16 nut-and-bolt station inspired by NIST Assembly Task Board 1, using Isaac Lab's
# Factory M16 assets (NVIDIA, loaded at runtime). It is not the full ATB1 board or its CAD.
# The earlier procedural M8 box-ridge thread only held below ~5 mN m of turning torque
# (scored 100 at 2 mN m; 5-50 mN m skipped turns or threw the nut, free or held upright), so it
# could not survive a robot gripper. Factory's meshes have real threads with SDF collision.
task_description: Tighten the nut onto the bolt.
episode_length_s: 120

fastener:
  nominal: M16
  # MEASURED from the bolt's SDF collision mesh: right-hand, 2.0 mm pitch (helix fit of 9220
  # crest points: concentration 0.88 for right-hand 2.0 mm, <= 0.17 for any other hypothesis).
  pitch_m: 0.002
  handedness: right
  # Production bucket (the staging copies of Arena assets return 404). Not vendored here.
  nut_usd: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/6.1/Isaac/IsaacLab/Factory/factory_nut_m16.usd
  bolt_usd: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/6.1/Isaac/IsaacLab/Factory/factory_bolt_m16.usd
  # MEASURED from the meshes (usd-core). Bolt frame: origin at the base of the hex head.
  bolt_length_m: 0.035
  bolt_head_height_m: 0.010
  bolt_head_corner_radius_m: 0.01386
  shank_major_radius_m: 0.00784
  shank_minor_radius_m: 0.00638
  # Nut frame: the body origin is 10 mm below the nut's lower face (authored seated on the head).
  nut_height_m: 0.013
  nut_across_flats_m: 0.024
  nut_origin_to_lower_face_m: 0.010
  nut_bore_minor_radius_m: 0.0069
  nut_mass_kg: 0.05

table:
  # Measured on the server (environments/tools/probe_runtime.py --sim): maple_table_robolab
  # spawns at the origin; collision top z = 0.003, footprint x [0.1986, 0.8986], y [-0.4779, 0.5221].
  center_xy: [0.5486, 0.0221]
  half_extents_xy: [0.35, 0.50]
  top_z_m: 0.003
  fall_below_m: 0.05

fixture_pose:
  # Seat face: table top 0.003 + bolt head 0.010 + plate 0.009.
  position_xyz: [0.55, 0.0, 0.022]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

nut_pose:
  # Nut origin = mat top (0.004) - 0.010, because the origin is 10 mm below the lower face.
  position_xyz: [0.55, 0.15, -0.006]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

# The fixture is a kinematic block that holds the bolt: a lower layer with a pocket around the
# hex head and an upper plate with a clearance hole around the shank. Its origin is the centre
# of the plate top, which is the seat face. No collider touches the bolt.
fixture_body:
  plate_thickness_m: 0.009
  hole_half_m: 0.009
  pocket_half_m: 0.015
  block_half_xy_m: [0.04, 0.03]
  mass_kg: 0.4
  static_friction: 0.6
  dynamic_friction: 0.45

# The nut starts lying flat on this flat static mat (part of the fixture body).
start_mat:
  thickness_m: 0.001
  half_xy_m: [0.02, 0.02]

scoring:
  lift_clearance_m: 0.015
  fixture_motion_tolerance_m: 0.005
  # The fixture is kinematic, so these only fire if a reset or another writer moves it.
  fixture_rotation_tolerance_deg: 5.0
  # A nut on the thread tilts at most atan(2 x 0.52 mm / 13 mm) = 4.6 deg (minor-diameter
  # clearance over the nut height; the flanks hold it tighter). Beyond 5 deg it is not threaded.
  wedge_angle_deg: 5.0
  # Covers the bore-to-shank radial play (0.69 - 0.638 mm minor radii ~ 0.52 mm).
  radial_max_m: 0.001
  track_radial_m: 0.006
  track_tilt_deg: 20.0
  min_engagement_turns: 0.5
  turn_tolerance: 0.5
  # Server run at 550ecb1: the nut dropped 2.45 mm onto the first full crest without turning
  # (chamfered bolt tip) and then spun ~0.4 turn before the thread caught, so a correctly
  # threaded nut was flagged cross-threaded and the seat scored 25. Inside this top band the
  # turn count follows the descent; the consistency check starts below it.
  thread_lead_in_m: 0.0025
  seat_gap_m: 0.001
  deep_fraction: 0.75

grasp:
  # GEOMETRIC PROXY. The `gripper` body within radius_m of the nut, fingers between min and max open.
  # Fingers shut on nothing read ~0 open, so the min keeps an empty closed gripper from counting.
  radius_m: 0.055
  hold_open_fraction_min: 0.05
  # MEASURED (reach_check a5f5537): fingers closed on the 24 mm flats read 0.441 open while
  # lifting the nut. 0.35 would have counted that real hold as released.
  hold_open_fraction_max: 0.6

physics:
  # Fixture block colliders.
  contact_offset_m: 0.0003
  # Applied to the Factory nut and bolt as USD overs, as Isaac Lab's Factory task configures
  # them: 192 position iterations, gentle-but-not-tiny depenetration, gyroscopic forces, an
  # uncapped contact impulse, 5 mm contact offset and 0 rest offset on the SDF meshes.
  fastener_solver_position_iterations: 192
  fastener_solver_velocity_iterations: 1
  fastener_max_depenetration_velocity_m_s: 5.0
  fastener_enable_gyroscopic_forces: true
  fastener_max_contact_impulse: 1.0e+32
  fastener_contact_offset_m: 0.005
  fastener_rest_offset_m: 0.0
  # Factory's held/fixed asset friction (Isaac Lab factory_tasks_cfg), bound as a USD physics
  # material on both meshes. The Factory USDs carry no physics material of their own.
  fastener_friction: 0.75
  # The fixture block. Scene-level PhysX settings (Factory uses up to 192 solver iterations
  # scene-wide and tuned GPU buffers) belong to the Arena env and are not set here.
  fixture_solver_position_iterations: 32
  fixture_solver_velocity_iterations: 1

robot:
  # Absolute path of the shared converted asset; YAM_USD overrides it. Not edited by this package.
  usd_path: /home/ubuntu/workspace/robocurve/assets/yam/yam_source_resolved/yam_source_resolved.usda
  layout: duplicated_single_arm
  home_arm_rad: [0.4, 1.2, 1.0, -0.5, 0.0, 0.0]
  finger_open_m: -0.04695
  # MEASURED (battery reach_check c54b4eb, same YAM asset): each finger's geometry centre sits
  # ~173 mm from its body origin; holding is measured from these pad centres.
  finger_pad_offsets_m: [[0.014, 0.059, -0.173], [0.014, 0.0338, -0.173]]
  finger_closed_m: 0.0
  # On the tabletop, 5 cm inside its near edge (x = 0.1986). The station is 0.30 m in front.
  # Base z assumes the YAM root frame is at the bottom of its base; not yet checked on the server.
  left_base_xyz: [0.25, 0.22, 0.003]
  right_base_xyz: [0.25, -0.22, 0.003]
  # Measured in the converted YAM USDA: bodies base, link1..link5, gripper, tip_left, tip_right.
  gripper_body_name: gripper
  # Provisional implicit gains, stiffer than battery-remote's 80/20/40 so gravity sag stays
  # small. Not a calibration of the real YAM motors.
  actuators:
    proximal: {stiffness: 400.0, damping: 40.0, effort: 20.0, velocity: 3.0}
    distal: {stiffness: 150.0, damping: 15.0, effort: 10.0, velocity: 3.0}
    finger: {stiffness: 400.0, damping: 20.0, effort: 10.0, velocity: 0.2}

cameras:
  - name: overhead
    eye_xyz: [0.55, 0.0, 0.703]
    target_xyz: [0.55, 0.0, 0.033]
    rotation_xyzw: [1.0, 0.0, 0.0, 0.0]
  - name: front
    eye_xyz: [1.12, 0.0, 0.303]
    target_xyz: [0.55, 0.0, 0.033]
    rotation_xyzw: [-0.5975128334895923, 0.5975128334895922, 0.3781248653754985, -0.3781248653754985]
  - name: side
    eye_xyz: [0.55, -0.70, 0.253]
    target_xyz: [0.55, 0.0, 0.033]
    rotation_xyzw: [0.0, 0.8061720029684715, 0.5916812500238644, 0.0]
