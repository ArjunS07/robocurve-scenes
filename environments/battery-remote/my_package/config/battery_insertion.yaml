# Provisional battery-insertion parameters.
# Nothing here is hardware-calibrated or taken from measured CAD.
# Comments are not loaded. Every numeric key below is read strictly.

# false builds both slots. The launch flag --single_slot overrides this.
single_slot: false

# Provisional dome intensity passed to Arena's light.set_intensity. Not a measured lux value.
light_intensity: 2000.0

battery:
  # Provisional AAA body. A typical AAA cell is about 10.5 mm by 44.5 mm.
  diameter_m: 0.0105
  length_m: 0.0445
  mass_kg: 0.0115
  # Visual positive nub only. It has no collision, so it does not fight the plunger.
  nub_radius_m: 0.0022
  nub_length_m: 0.0015
  # Provisional friction. Not measured on a real cell or on this table.
  static_friction: 0.40
  dynamic_friction: 0.30
  restitution: 0.0
  # On the server (942249a) a cell lying on the maple table rolled ~20 mm in 2 s and was still
  # speeding up, so that patch of the table collider is not level. The start marks are now flat
  # 1 mm static mats (a printed, taped-down mark), and cells get light rolling damping.
  angular_damping: 0.5
  start_mat_thickness_m: 0.001

compartment:
  # Reference: Angrox LG-style replacement remote, ASIN B07T4N7NTX.
  # MEASURED (listing): 23.5 x 4.8 x 2.4 cm, black ABS, two AAA cells.
  # ESTIMATED (photo / typical two-AAA bays; the listing gives no bay drawing): everything else.
  # The remote lies face down: the button face is on the table and the open bay faces up.
  # Collision block around the bay, meters: 46 mm wide (ESTIMATED; the listed 48 mm is the
  # widest point, at the IR end) and 22 mm tall (ESTIMATED; the listed 24 mm is the maximum).
  size_xyz: [0.140, 0.046, 0.022]
  # Full wand length. MEASURED (listing). The extra length is a solid nose past the rear face.
  silhouette_length_m: 0.235
  # Visual shell: widest at the IR nose (half of the listed 48 mm), tapering to the bay
  # width; rounded ends and filleted top edges. Fillet and end radius are ESTIMATED.
  shell_nose_half_width_m: 0.024
  shell_edge_fillet_m: 0.004
  shell_end_radius_m: 0.012
  # Authored on the chassis in the generated USDA. The spawner does not override it.
  mass_kg: 0.080
  static_friction: 0.50
  dynamic_friction: 0.40
  restitution: 0.0
  # x stations in the remote frame. The bay is centered on seat_center_x.
  rear_face_x: -0.090
  front_face_x: 0.050
  seat_center_x: -0.020
  # Slot floor height in the remote frame. The shell top is at +0.011, so a seated
  # 10.5 mm cell sits 1 mm below the rim and its upper half stays reachable.
  floor_z_m: -0.0005
  # Slot is wider than the cell: 13 mm for a 10.5 mm cell.
  channel_y_half: 0.0065
  # A seated cell compresses its spring plunger by this much. Must be inside the travel.
  spring_preload_m: 0.0015
  # Plunger pad: x length, y width, z height. Centered on the seated cell axis.
  plunger_size_xyz: [0.004, 0.007, 0.006]
  # Free space for a vertical drop is the cell length + travel - preload (2.5 mm here).
  plunger_travel_m: 0.004
  # Clearance from a fully compressed plunger to the bay end wall.
  plunger_end_gap_m: 0.001
  plunger_mass_kg: 0.002
  plunger_stiffness: 220.0
  plunger_damping: 6.0
  plunger_effort_limit_n: 5.0
  plunger_velocity_limit_m_s: 0.05
  # Flat-cap contact uses this distance, not the cell radius.
  spring_contact_distance_m: 0.0005
  # Must stay below the ~1 mm clearances. Arena's 5 mm procedural default would glue the cell.
  contact_offset_m: 0.0003
  solver_position_iterations: 16
  solver_velocity_iterations: 1
  slots:
    # The spring sits at each slot's negative end, like a real series pair.
    # Either physical cell may be inserted into either slot.
    - name: slot_a
      center_y_m: -0.012
      required_axis_xyz: [1.0, 0.0, 0.0]
    - name: slot_b
      center_y_m: 0.012
      required_axis_xyz: [-1.0, 0.0, 0.0]

scoring:
  # The cell must stay seated, oriented, and released for this long. Provisional.
  retention_window_s: 1.0
  # Lowest point of the cell must clear the table top by this much to count as lifted.
  lift_clearance_m: 0.015
  # The remote is fixed to the world (secured fixture). This only fires if that fixture breaks.
  remote_motion_tolerance_m: 0.005
  remote_yaw_tolerance_deg: 5.0
  # PROXY only. This is a contact-force threshold, not a model of visible damage.
  damage_force_proxy_n: 30.0
  # GEOMETRIC PROXY, not a contact test: a gripper counts as holding when its body is this
  # close and its fingers are shut. Missing gripper names make holding unknown, which blocks credit.
  grasp_radius_m: 0.04
  hold_open_fraction_max: 0.35
  polarity_angle_deg: 20.0
  # Seated when the cell center is within this of seat_center_x along the slot, on either side.
  axial_tolerance_m: 0.0015
  # Distance from the seated cell axis (slot centerline at rest height). Lateral clearance is 1.25 mm.
  seat_radial_max_m: 0.002
  episode_length_s: 90.0
  # Set false if contact-sensor prims abort startup. The damage proxy then stays at 0.
  enable_contact_sensors: true

table:
  # Measured on the server with environments/tools/probe_runtime.py --sim:
  # maple_table_robolab spawns at the origin; its collision top is z = 0.003 and its
  # footprint is x [0.1986, 0.8986], y [-0.4779, 0.5221]. Its friction is not overridden.
  top_z_m: 0.003
  center_xy: [0.5486, 0.0221]
  half_extents_xy: [0.35, 0.50]
  fall_below_m: 0.05

# Identity quaternion is xyzw (0, 0, 0, 1). Battery quaternion is +90 deg about Y,
# which maps the cell's local +Z (positive terminal) onto world +X.
remote_pose:
  position_xyz: [0.57, 0.00, 0.014]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
battery_a_pose:
  position_xyz: [0.57, -0.090, 0.00925]
  rotation_xyzw: [0.0, 0.7071067811865475, 0.0, 0.7071067811865476]
battery_b_pose:
  position_xyz: [0.57, 0.090, 0.00925]
  rotation_xyzw: [0.0, 0.7071067811865475, 0.0, 0.7071067811865476]

cameras:
  # Poses are provisional. Rotations are the ROS optical look-at of eye toward target.
  # Physics smoke does not spawn them. Pass --enable-cameras to spawn them.
  - name: overhead_cam
    eye_xyz: [0.57, 0.00, 0.553]
    target_xyz: [0.57, 0.00, 0.013]
    rotation_xyzw: [1.0, 0.0, 0.0, 0.0]
    width: 256
    height: 256
    focal_length: 2.1
    focus_distance: 40.0
    horizontal_aperture: 5.376
    vertical_aperture: 3.024
  - name: front_cam
    eye_xyz: [1.12, 0.00, 0.303]
    target_xyz: [0.57, 0.00, 0.033]
    rotation_xyzw: [-0.6001402316624453, 0.6001402316624455, 0.3739407738401181, -0.3739407738401181]
    width: 256
    height: 256
    focal_length: 2.1
    focus_distance: 40.0
    horizontal_aperture: 5.376
    vertical_aperture: 3.024
  - name: side_cam
    eye_xyz: [0.57, -0.70, 0.253]
    target_xyz: [0.57, 0.00, 0.033]
    rotation_xyzw: [0.0, 0.8061720029684715, 0.5916812500238644, 0.0]
    width: 256
    height: 256
    focal_length: 2.1
    focus_distance: 40.0
    horizontal_aperture: 5.376
    vertical_aperture: 3.024

robot:
  # Reference only. This package does not edit the USDA.
  usda_path: /home/ubuntu/workspace/robocurve/assets/yam/yam_source_resolved/yam_source_resolved.usda
  # duplicated_single_arm spawns that USDA twice and expects joint1..joint8 on each.
  # combined expects one articulation with left_joint* and right_joint* (unconfirmed).
  # If the live joint list differs, the action term raises and names the joints it found.
  arm_layout: duplicated_single_arm
  # Provisional home, radians, inside the source URDF limits. Both arms use it.
  home_arm_rad: [0.4, 1.2, 1.0, -0.5, 0.0, 0.0]
  # Source URDF: 0 is closed, negative opens. Station URDF uses the opposite sign.
  finger_closed_m: 0.0
  finger_open_m: -0.04695
  # MEASURED (reach_check c54b4eb): each finger's geometry centre sits ~173 mm from its body
  # origin, so holding is measured from these pad centres, not from the finger body origins.
  finger_pad_offsets_m: [[0.014, 0.059, -0.173], [0.014, 0.0338, -0.173]]
  home_open_fraction: 1.0
  arm_action_scale: 1.0
  gripper_action_scale: 1.0
  # Provisional implicit-actuator gains. They are not the motor kp/kd in yam_v1.yml
  # and they are not a calibration. They override the URDF's placeholder effort of 1
  # only inside the simulator config. The USDA file is not modified.
  # Raised from 80/8 and 20/2 (effort 20): in the reach check (8606c5d) joints 2 and 3
  # sagged 0.11-0.16 rad below their targets whenever the arm reached toward the table, so
  # the fingertips stopped 50-150 mm short. 400/40 and 150/15 match the nut scene; the 30 N m
  # effort limit is an ESTIMATE of a shoulder-class actuator's peak, not a YAM datasheet value.
  proximal_stiffness: 400.0
  proximal_damping: 40.0
  distal_stiffness: 150.0
  distal_damping: 15.0
  # Raised from 40/2: in the reach check one finger stalled ~15 mm open on every close
  # (40 N/m x 15 mm = 0.6 N) while the other shut. 400/20 matches the nut scene.
  finger_stiffness: 400.0
  finger_damping: 20.0
  arm_effort_limit: 30.0
  arm_velocity_limit: 3.0
  finger_effort_limit: 10.0
  finger_velocity_limit: 0.2
  # Bases stand on the measured tabletop (x 0.1986..0.8986, y -0.4779..0.5221, z 0.003),
  # 7 cm in from the near edge. The loader checks XY against the footprint and that the bay
  # and both cells are 0.20..0.45 m from the nearer base. The YAM base-link footprint and
  # the arm's forward axis are NOT measured yet; see environments/tools/probe_runtime.py.
  left_pose:
    position_xyz: [0.27, 0.20, 0.003]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
  right_pose:
    position_xyz: [0.27, -0.20, 0.003]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
